<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldMetallic" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EAC775" />
      <stop offset="35%" stop-color="#C59B27" />
      <stop offset="65%" stop-color="#A27918" />
      <stop offset="100%" stop-color="#DFBA5A" />
    </linearGradient>

    <linearGradient id="goldLightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5DC92" />
      <stop offset="100%" stop-color="#B88E22" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- 1. GEOMETRIC FG MONOGRAM -->
    <g transform="translate(300, 190) rotate(45)">
      <!-- Outer Diamond Frame Background Glow/Shadow in dark mode -->
      
      <!-- WHITE 'F' MONOGRAM PATHS (Top & Left) -->
      <!-- Main outer L-bar of F -->
      <path d="M -80,-80 L -80,50 L -50,50 L -50,-50 L 50,-50 L 50,-80 Z" fill="#FFFFFF" />
      <!-- Inner horizontal bar of F -->
      <path d="M -50,-20 L 20,-20 L 20,10 L -50,10 Z" fill="#F0F0F0" />
      <!-- Corner block extension -->
      <path d="M -20,10 L 10,10 L 10,40 L -20,40 Z" fill="#FFFFFF" />

      <!-- GOLD 'G' MONOGRAM PATHS (Bottom & Right) -->
      <!-- Main outer L-bar of G -->
      <path d="M 80,80 L 80,-50 L 50,-50 L 50,50 L -50,50 L -50,80 Z" fill="url(#goldMetallic)" />
      <!-- Inner hook of G -->
      <path d="M 50,20 L -20,20 L -20,-10 L 50,-10 Z" fill="url(#goldLightGrad)" />
      <!-- Corner block extension for G -->
      <path d="M 20,-10 L -10,-10 L -10,-40 L 20,-40 Z" fill="url(#goldMetallic)" />
    </g>

    <!-- 2. BRAND NAME TEXT "FAROOQ" -->
    <g transform="translate(300, 395)">
      <!-- Letter F -->
      <text x="-165" y="0" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="62" font-weight="700" fill="#FFFFFF" letter-spacing="4">F</text>
      
      <!-- Letter A with Golden Inverted Triangle inside counter -->
      <g transform="translate(-95, 0)">
        <text x="0" y="0" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="62" font-weight="700" fill="#FFFFFF" text-anchor="middle">A</text>
        <polygon points="0,-22 -9,-35 9,-35" fill="url(#goldMetallic)" />
      </g>

      <!-- Letters R O O Q -->
      <text x="-30" y="0" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="62" font-weight="700" fill="#FFFFFF">R</text>
      <text x="38" y="0" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="62" font-weight="700" fill="#FFFFFF">O</text>
      <text x="105" y="0" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="62" font-weight="700" fill="#FFFFFF">O</text>
      <text x="175" y="0" font-family="'Cinzel', 'Playfair Display', 'Times New Roman', serif" font-size="62" font-weight="700" fill="#FFFFFF">Q</text>
    </g>

    <!-- 3. SUBTITLE: — GARMENTS — -->
    <g transform="translate(300, 465)">
      <!-- Left Dash -->
      <line x1="-230" y1="-8" x2="-145" y2="-8" stroke="url(#goldMetallic)" stroke-width="3" stroke-linecap="round" />
      
      <!-- GARMENTS Text -->
      <text x="0" y="0" font-family="'Montserrat', 'Cinzel', sans-serif" font-size="26" font-weight="600" fill="url(#goldMetallic)" text-anchor="middle" letter-spacing="14">GARMENTS</text>
      
      <!-- Right Dash -->
      <line x1="145" y1="-8" x2="230" y2="-8" stroke="url(#goldMetallic)" stroke-width="3" stroke-linecap="round" />
    </g>

    <!-- 4. BOTTOM XX CHEVRON EMBLEM -->
    <g transform="translate(300, 525)">
      <path d="M -22,-16 L 0,6 L 22,-16 M -22,6 L 0,-16 L 22,6" fill="none" stroke="url(#goldMetallic)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>
</svg>
